name: Generate MultiSnake

on:
  schedule:
    - cron: "0 */6 * * *" # Berjalan otomatis setiap 6 jam
  workflow_dispatch: # Mengaktifkan tombol Run workflow manual

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Membuat animasi ular kontribusi dari akun GitHub Anda
      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bombom778
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Mendorong berkas gambar ular ke branch 'output' agar bisa dipanggil
      - name: 🚀 Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
