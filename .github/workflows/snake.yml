name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write # WAJIB ADA: Membuka kunci izin agar robot tidak error 128
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Langkah 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bombom778
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Langkah 3: Deploy using the official high-security library
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
